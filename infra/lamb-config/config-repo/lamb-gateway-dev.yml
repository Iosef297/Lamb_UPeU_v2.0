server:
  port: 18080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:18180/realms/lamb
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      server:
        webmvc:
          routes:
            - id: lamb-personas
              uri: lb://lamb-personas-ms
              predicates:
                - Path=/api/v1/persona/**
            - id: lamb-personas-relacion-responsable
              uri: lb://lamb-personas-ms
              predicates:
                - Path=/api/v1/relacion-responsable/**
            - id: lamb-personas-documento-persona
              uri: lb://lamb-personas-ms
              predicates:
                - Path=/api/v1/documento-persona/**
            - id: lamb-personas-identificacion
              uri: lb://lamb-personas-ms
              predicates:
                - Path=/api/v1/identificacion/**
            - id: lamb-personas-contacto-direccion
              uri: lb://lamb-personas-ms
              predicates:
                - Path=/api/v1/contacto-direccion/**
            - id: lamb-personas-datos-personales
              uri: lb://lamb-personas-ms
              predicates:
                - Path=/api/v1/datos-personales/**
            - id: lamb-institucional-facultades
              uri: lb://lamb-institucional-ms
              predicates:
                - Path=/api/v1/facultades/**
            - id: lamb-institucional-programas
              uri: lb://lamb-institucional-ms
              predicates:
                - Path=/api/v1/programas/**
            - id: lamb-institucional-calendario
              uri: lb://lamb-institucional-ms
              predicates:
                - Path=/api/v1/calendario/**
            - id: lamb-institucional-campus-sede
              uri: lb://lamb-institucional-ms
              predicates:
                - Path=/api/v1/campus-sede/**
            - id: lamb-institucional-facultad-escuela
              uri: lb://lamb-institucional-ms
              predicates:
                - Path=/api/v1/facultad-escuela/**
            - id: lamb-institucional-institucion
              uri: lb://lamb-institucional-ms
              predicates:
                - Path=/api/v1/institucion/**
            - id: lamb-institucional-parametro-auditoria
              uri: lb://lamb-institucional-ms
              predicates:
                - Path=/api/v1/parametro-auditoria/**
            - id: lamb-institucional-periodo-academico
              uri: lb://lamb-institucional-ms
              predicates:
                - Path=/api/v1/periodo-academico/**
            - id: lamb-institucional-programa-academico
              uri: lb://lamb-institucional-ms
              predicates:
                - Path=/api/v1/programa-academico/**
            - id: lamb-planificacion-cursos
              uri: lb://lamb-planificacion-ms
              predicates:
                - Path=/api/v1/cursos/**
            - id: lamb-planificacion-secciones
              uri: lb://lamb-planificacion-ms
              predicates:
                - Path=/api/v1/secciones/**
            - id: lamb-planificacion-grupos
              uri: lb://lamb-planificacion-ms
              predicates:
                - Path=/api/v1/grupos/**
            - id: lamb-admision
              uri: lb://lamb-admision-ms
              predicates:
                - Path=/api/v1/postulaciones/**
            - id: lamb-admision-convocatorias
              uri: lb://lamb-admision-ms
              predicates:
                - Path=/api/v1/convocatorias/**
            - id: lamb-admision-postulantes
              uri: lb://lamb-admision-ms
              predicates:
                - Path=/api/v1/postulantes/**
            - id: lamb-admision-inscripciones
              uri: lb://lamb-admision-ms
              predicates:
                - Path=/api/v1/inscripciones/**
            - id: lamb-admision-examenes
              uri: lb://lamb-admision-ms
              predicates:
                - Path=/api/v1/examenes-admision/**
            - id: lamb-admision-seguimientos
              uri: lb://lamb-admision-ms
              predicates:
                - Path=/api/v1/seguimientos/**
            - id: lamb-admision-calificaciones
              uri: lb://lamb-admision-ms
              predicates:
                - Path=/api/v1/calificaciones/**
            - id: lamb-admision-adjudicaciones
              uri: lb://lamb-admision-ms
              predicates:
                - Path=/api/v1/adjudicaciones/**
            - id: lamb-admision-casos-especiales
              uri: lb://lamb-admision-ms
              predicates:
                - Path=/api/v1/casos-especiales/**
            - id: lamb-admision-tipos-documento
              uri: lb://lamb-admision-ms
              predicates:
                - Path=/api/v1/tipos-documento/**
            - id: lamb-admision-modalidades
              uri: lb://lamb-admision-ms
              predicates:
                - Path=/api/v1/modalidades-admision/**
            - id: lamb-curriculo
              uri: lb://lamb-curriculo-ms
              predicates:
                - Path=/api/v1/planes-estudio/**
            - id: lamb-curriculo-mallas
              uri: lb://lamb-curriculo-ms
              predicates:
                - Path=/api/v1/mallas-curriculares/**
            - id: lamb-matricula
              uri: lb://lamb-matricula-ms
              predicates:
                - Path=/api/v1/matriculas/**
            - id: lamb-evaluacion
              uri: lb://lamb-evaluacion-ms
              predicates:
                - Path=/api/v1/notas/**
            - id: lamb-evaluacion-actas
              uri: lb://lamb-evaluacion-ms
              predicates:
                - Path=/api/v1/actas/**
            - id: lamb-trayectoria
              uri: lb://lamb-trayectoria-ms
              predicates:
                - Path=/api/v1/trayectorias/**
            - id: lamb-trayectoria-cumplimientos
              uri: lb://lamb-trayectoria-ms
              predicates:
                - Path=/api/v1/cumplimientos-requisito/**
            - id: lamb-trayectoria-alertas-riesgo
              uri: lb://lamb-trayectoria-ms
              predicates:
                - Path=/api/v1/alertas-riesgo/**
            - id: lamb-trayectoria-tutorias
              uri: lb://lamb-trayectoria-ms
              predicates:
                - Path=/api/v1/tutorias/**
            - id: lamb-trayectoria-reconocimientos
              uri: lb://lamb-trayectoria-ms
              predicates:
                - Path=/api/v1/reconocimientos/**
            - id: lamb-trayectoria-egresos
              uri: lb://lamb-trayectoria-ms
              predicates:
                - Path=/api/v1/egresos/**
            - id: lamb-finanzas
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/pagos/**
            # Una ruta por microservicio: /ms/<servicio>/api/v1/... -> /api/v1/... en ese servicio.
            # Evita los choques de rutas repetidas entre servicios (/cursos, /pagos, /vistas).
            - id: ms-personas
              uri: lb://lamb-personas-ms
              predicates:
                - Path=/ms/personas/**
              filters:
                - StripPrefix=2
            - id: ms-institucional
              uri: lb://lamb-institucional-ms
              predicates:
                - Path=/ms/institucional/**
              filters:
                - StripPrefix=2
            - id: ms-admision
              uri: lb://lamb-admision-ms
              predicates:
                - Path=/ms/admision/**
              filters:
                - StripPrefix=2
            - id: ms-curriculo
              uri: lb://lamb-curriculo-ms
              predicates:
                - Path=/ms/curriculo/**
              filters:
                - StripPrefix=2
            - id: ms-planificacion
              uri: lb://lamb-planificacion-ms
              predicates:
                - Path=/ms/planificacion/**
              filters:
                - StripPrefix=2
            - id: ms-matricula
              uri: lb://lamb-matricula-ms
              predicates:
                - Path=/ms/matricula/**
              filters:
                - StripPrefix=2
            - id: ms-evaluacion
              uri: lb://lamb-evaluacion-ms
              predicates:
                - Path=/ms/evaluacion/**
              filters:
                - StripPrefix=2
            - id: ms-trayectoria
              uri: lb://lamb-trayectoria-ms
              predicates:
                - Path=/ms/trayectoria/**
              filters:
                - StripPrefix=2
            - id: ms-finanzas
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/ms/finanzas/**
              filters:
                - StripPrefix=2
            - id: ms-ingresos-pagos
              uri: lb://ingresos-pagos-ms
              predicates:
                - Path=/ms/ingresos-pagos/**
              filters:
                - StripPrefix=2
            - id: ms-lms
              uri: lb://lms-ms
              predicates:
                - Path=/ms/lms/**
              filters:
                - StripPrefix=2

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://localhost:18761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
